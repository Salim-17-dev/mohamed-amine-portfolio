    <style>
      html, body { margin: 0; min-height: 100%; background: #080d1a; }
      #boot-screen {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #080d1a; color: #f8fafc; transition: opacity .35s ease, visibility .35s ease;
      }
      #boot-screen.is-hidden { opacity: 0; visibility: hidden; }
      .boot-content { display: grid; justify-items: center; gap: 16px; }
      .boot-mark { width: 58px; height: 58px; padding: 4px; border: 1px solid #475569; border-radius: 50%; background: #111827; box-shadow: 0 0 0 5px #0b1020; }
      .boot-mark img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: top; }
      .boot-line { width: 112px; height: 1px; overflow: hidden; background: #1e293b; }
      .boot-line::after { display: block; width: 42%; height: 100%; background: #e5e7eb; content: ''; animation: boot-load 1s ease-in-out infinite; }
      .boot-text { font: 11px/1.2 monospace; letter-spacing: .18em; text-transform: uppercase; color: #94a3b8; }
      @keyframes boot-load { from { transform: translateX(-110%); } to { transform: translateX(270%); } }
    </style>
  </head>
  <body>
    <div id="boot-screen" aria-label="Chargement du portfolio">
      <div class="boot-content">
        <div class="boot-mark"><img src="/src/components/image/PHOTO.jpeg" alt="Mohamed Amine Salim" /></div>
        <div class="boot-line"></div>
        <div class="boot-text">Chargement</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
